name: Build WuKongClient

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build with Gradle Wrapper
        run: bash ./gradlew clean build --no-daemon --console=plain
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WuKongClient-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
